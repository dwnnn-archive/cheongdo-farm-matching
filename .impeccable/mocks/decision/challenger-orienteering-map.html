<style>

<body><header><div class="brand">일손이음</div><nav><span>일자리 찾기</span><span>내 신청</span><span>농가 공고</span></nav><div class="user">청도군　로그인</div></header>
<div class="layout"><aside class="side"><div class="link active">일자리 찾기</div><div class="link">내 신청 내역</div><hr><div class="link">공고 등록</div></aside><main class="main"><div class="head"><div><h1>청도 일자리 찾아보기</h1><p>지역과 조건을 살펴보고 맞는 작업을 찾아보세요.</p></div></div><div class="filter"><span>지역: 청도군 전체　⌄</span><span>날짜　⌄</span><span>급여　⌄</span><span>작업 종류　⌄</span></div>
